<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>סדר דין פלילי · אפליקציית לימוד לבחינה · פרופ' טמיר</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;500;700;900&family=Rubik:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17233d; --navy:#0f1e38; --navy2:#1a2e4c; --navy3:#25406a; --paper:#e5e9f0; --card:#FFFFFF;
  --line:#dce2ec; --muted:#5a6a85; --stamp:#c0392b; --ok:#1f9d6b; --okbg:#e7f6ef;
  --gold:#8a6d1a; --gold-bright:#d3a73e; --gold-2:#c1902f; --gold-bg:#f8edd8; --goldln:#ecd9a8;
  --blue:#305686; --blue-bg:#e8eff9; --warn:#9a5b00; --warn-bg:#fcf1e1;
  --sidebar:#0f1e38; --sidebar-text:#c3cee0; --sidebar-active:#1e3557;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Heebo',sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:900px;margin:0 auto;padding:0}
/* ── shell: sidebar + main ── */
#appMain{display:flex;align-items:stretch;min-height:100vh;max-width:1200px;margin:0 auto}
.sidebar{width:242px;flex-shrink:0;background:var(--sidebar);color:var(--sidebar-text);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.side-brand{display:flex;align-items:center;gap:11px;padding:2px 8px 18px}
.brand-logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--gold-bright),var(--gold-2));display:flex;align-items:center;justify-content:center;font-size:1.4rem;box-shadow:0 4px 12px rgba(211,167,62,.4);flex-shrink:0}
.brand-title{font-family:'Rubik',sans-serif;font-weight:700;font-size:1.08rem;color:#fff;line-height:1.15}
.brand-sub{font-size:.68rem;color:var(--gold-bright);margin-top:3px;line-height:1.35}
.side-nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto}
.side-nav button{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:11px;border:none;background:transparent;color:var(--sidebar-text);font-family:'Heebo';font-size:.92rem;font-weight:600;cursor:pointer;text-align:right;width:100%;transition:background .15s,color .15s}
.side-nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.side-nav button.on{background:var(--sidebar-active);color:#fff;box-shadow:inset 3px 0 0 var(--gold-bright)}
.side-foot{padding-top:12px;margin-top:8px;border-top:1px solid rgba(255,255,255,.09);font-size:.7rem;color:#8595ad;line-height:1.6}
.main{flex:1;min-width:0;padding:24px 28px 80px;max-width:920px}
.main-head{margin-bottom:14px}
.main-title{font-family:'Rubik',sans-serif;font-size:1.55rem;font-weight:700;color:var(--navy)}
main{padding-top:0}
@media(max-width:820px){
  #appMain{flex-direction:column}
  .sidebar{width:100%;height:auto;position:sticky;top:0;z-index:50;padding:10px 14px;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px}
  .side-brand{padding:0;flex:1}
  .brand-logo{width:38px;height:38px;font-size:1.2rem}
  .side-foot{display:none}
  .side-nav{order:3;flex-direction:row;overflow-x:auto;gap:5px;width:100%;flex-basis:100%;padding-bottom:2px}
  .side-nav button{white-space:nowrap;padding:9px 13px;font-size:.86rem;flex-shrink:0}
  .side-nav button.on{box-shadow:inset 0 -3px 0 var(--gold-bright)}
  .main{padding:18px 15px 70px;max-width:100%}
}
section.tab{display:none;animation:fade .25s ease}
section.tab.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:1.5rem;margin:8px 0 12px;color:var(--navy)}
h3{font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:1.15rem;margin:18px 0 8px;color:var(--navy2)}
p{margin-bottom:10px}
.lead{color:var(--muted);font-size:1rem;margin-bottom:18px}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(20,35,59,.04)}
.grid{display:grid;gap:12px}
.grid2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.grid3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.note{background:var(--gold-bg);border:1px solid var(--goldln);border-radius:12px;padding:13px 16px;margin:12px 0;font-size:.94rem}
.note b{color:var(--gold)}
.warn{background:var(--warn-bg);border:1px solid #eecfa0;border-radius:12px;padding:13px 16px;margin:12px 0;font-size:.94rem}
.warn b{color:var(--warn)}
.exam{background:var(--okbg);border:1px solid #b6ded8;border-radius:12px;padding:12px 16px;margin:12px 0;font-size:.93rem}
.exam b{color:var(--ok)}
.exam::before{content:"✅ לבחינה: ";font-weight:700;color:var(--ok)}
.stamp{display:inline-block;border:2.5px solid var(--stamp);color:var(--stamp);font-weight:700;font-size:.68rem;
  letter-spacing:.05em;padding:2px 9px;border-radius:4px;transform:rotate(-2deg);background:rgba(179,38,30,.05)}
ul,ol{margin:6px 22px 12px}
li{margin-bottom:5px}
/* tables */
.tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.9rem;overflow:hidden;border-radius:10px}
.tbl th{background:var(--navy);color:#fff;padding:9px 11px;text-align:right;font-weight:700}
.tbl td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top;background:#fff}
.tbl tr:nth-child(even) td{background:#f6f8fb}
.tbl.z td:first-child{font-weight:700;color:var(--navy2)}
/* accordion */
details{background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:11px;overflow:hidden}
details[open]{box-shadow:0 3px 14px rgba(20,35,59,.07)}
summary{cursor:pointer;padding:15px 18px;font-weight:700;list-style:none;display:flex;align-items:center;gap:12px;font-size:1.02rem}
summary::-webkit-details-marker{display:none}
summary .secmark{font-family:'Frank Ruhl Libre',serif;font-weight:900;color:#fff;background:linear-gradient(150deg,var(--navy),var(--navy3));
  min-width:38px;height:38px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0}
summary .arw{margin-inline-start:auto;color:var(--muted);transition:.2s;font-size:.8rem}
details[open] summary .arw{transform:rotate(180deg)}
details[open] summary{border-bottom:1px solid var(--line)}
.dcontent{padding:6px 20px 18px}
/* pills / search */
.searchbar{position:relative;margin-bottom:14px}
.searchbar input{width:100%;padding:13px 44px 13px 16px;border:2px solid var(--line);border-radius:12px;font-family:'Heebo';font-size:1rem;background:#fff}
.searchbar input:focus{outline:none;border-color:var(--blue)}
.searchbar svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.chip{background:#fff;border:1.5px solid var(--line);color:var(--muted);border-radius:20px;padding:6px 14px;font-size:.85rem;cursor:pointer;font-family:'Heebo';font-weight:600;transition:.15s}
.chip:hover{border-color:var(--blue)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
/* case card */
.case{background:#fff;border:1px solid var(--line);border-inline-start:5px solid var(--blue);border-radius:11px;padding:14px 16px;margin-bottom:11px}
.case .cn{font-weight:800;color:var(--navy);font-size:1.05rem;font-family:'Frank Ruhl Libre',serif}
.case .cc{color:var(--muted);font-size:.82rem;margin-bottom:6px}
.case .ch{font-size:.94rem}
.case .ctag{display:inline-block;background:var(--blue-bg);color:var(--blue);font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:20px;margin-top:8px}
.case.pri{border-inline-start-color:var(--stamp)}
.case.pri .ctag{background:#fbe9e8;color:var(--stamp)}
/* flashcards */
.fcbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.fcard{perspective:1600px;margin:0 auto 16px;max-width:640px}
.fcard-inner{position:relative;width:100%;min-height:250px;transition:transform .55s;transform-style:preserve-3d;cursor:pointer}
.fcard.flip .fcard-inner{transform:rotateY(180deg)}
.fcface{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;padding:26px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 5px 22px rgba(20,35,59,.13)}
.fcfront{background:linear-gradient(155deg,var(--navy),var(--navy3));color:#fff}
.fcback{background:#fff;border:2px solid var(--gold);transform:rotateY(180deg);color:var(--ink);overflow-y:auto}
.fcface .lbl{font-size:.72rem;letter-spacing:.12em;font-weight:700;opacity:.7;margin-bottom:12px}
.fcfront .q{font-size:1.3rem;font-weight:700;font-family:'Frank Ruhl Libre',serif}
.fcback .a{font-size:1.02rem;text-align:right;width:100%}
.fctopic{font-size:.75rem;color:var(--gold);font-weight:700;margin-top:14px}
.btn{background:var(--navy);color:#fff;border:none;border-radius:10px;padding:11px 20px;font-family:'Heebo';font-weight:700;font-size:.95rem;cursor:pointer;transition:.15s}
.btn:hover{background:var(--navy3)}
.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--line)}
.btn.ghost:hover{border-color:var(--blue)}
.btn.sm{padding:8px 15px;font-size:.86rem}
.fccount{font-weight:700;color:var(--muted)}
/* quiz */
.qcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(20,35,59,.04)}
.qnum{display:inline-block;background:var(--navy);color:#fff;font-weight:700;border-radius:8px;padding:2px 11px;font-size:.82rem;margin-bottom:10px}
.qsrc{color:var(--muted);font-size:.78rem;font-weight:600;float:left}
.qtext{font-weight:700;font-size:1.05rem;margin-bottom:14px}
.opt{display:block;background:#f6f8fb;border:2px solid var(--line);border-radius:11px;padding:12px 15px;margin-bottom:9px;cursor:pointer;font-size:.96rem;transition:.15s;position:relative}
.opt:hover{border-color:var(--blue);background:#eef3fa}
.opt.correct{background:var(--okbg);border-color:var(--ok);font-weight:600}
.opt.wrong{background:#fbe9e8;border-color:var(--stamp)}
.opt .mk{font-weight:800;margin-inline-end:8px;color:var(--navy2)}
.qexplain{background:var(--gold-bg);border:1px solid var(--goldln);border-radius:11px;padding:13px 15px;margin-top:10px;font-size:.92rem;display:none}
.qexplain.show{display:block}
.qexplain b{color:var(--gold)}
.scorebar{position:sticky;top:0;z-index:20;background:#fff;border:2px solid var(--navy);border-radius:12px;padding:12px 18px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 3px 12px rgba(20,35,59,.1);flex-wrap:wrap;gap:10px}
.scorebar .s{font-weight:800;font-size:1.1rem;color:var(--navy)}
.prog{height:8px;background:var(--line);border-radius:5px;overflow:hidden;flex:1;min-width:120px;margin:0 12px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#14a08a);width:0;transition:.4s}
/* sim */
.simq{background:#fff;border:1px solid var(--line);border-radius:13px;margin-bottom:13px;overflow:hidden}
.simq h4{background:linear-gradient(150deg,var(--navy2),var(--navy3));color:#fff;padding:13px 17px;font-size:1rem;font-family:'Heebo';font-weight:700;display:flex;justify-content:space-between;gap:10px;align-items:center}
.simq h4 .pts{background:rgba(255,255,255,.16);border-radius:20px;padding:2px 11px;font-size:.78rem;white-space:nowrap}
.simbody{padding:15px 18px}
.facts{font-size:.95rem;white-space:pre-line}
.model{margin-top:12px}
.model summary{padding:10px 0;font-size:.92rem;color:var(--ok);gap:8px}
.model summary .secmark{background:var(--ok);min-width:30px;height:30px;font-size:.8rem}
.modeltext{background:var(--okbg);border:1px solid #b6ded8;border-radius:11px;padding:14px 16px;font-size:.92rem;white-space:pre-line;margin-top:6px}
/* home cards */
.hero{background:linear-gradient(155deg,#fff,#f2f5fa);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px;text-align:center}
.stat .n{font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:1.9rem;color:var(--blue);line-height:1}
.stat .l{font-size:.82rem;color:var(--muted);margin-top:5px;font-weight:600}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;transition:.18s;border-top:4px solid var(--blue)}
.tile:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(20,35,59,.12)}
.tile .ti{font-size:1.6rem;margin-bottom:6px}
.tile .tt{font-weight:800;color:var(--navy);font-size:1.08rem;font-family:'Frank Ruhl Libre',serif}
.tile .td{font-size:.85rem;color:var(--muted);margin-top:4px}
/* flow diagram */
.flow{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.flow h3{margin-top:0}
.fnode{background:var(--navy);color:#fff;border-radius:11px;padding:11px 15px;margin:8px 0;font-size:.92rem;position:relative}
.fnode.gold{background:linear-gradient(150deg,var(--gold-bright),var(--gold-2))}
.fnode.gray{background:#5C6B84}
.fnode.y{background:var(--navy2)}
.fnode b{display:block;margin-bottom:2px}
.farrow{text-align:center;color:var(--muted);font-size:1.2rem;line-height:1}
.fdecision{border:2px solid var(--navy);background:#eef3fa;color:var(--navy);border-radius:11px;padding:11px 15px;margin:8px 0;font-weight:600;font-size:.92rem}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:6px}
/* progress ring in nav */
.badgep{background:var(--gold);color:#fff;border-radius:20px;font-size:.7rem;padding:1px 7px;margin-inline-start:5px;font-weight:800}
footer{text-align:center;color:var(--muted);font-size:.82rem;padding:26px 0 0;border-top:1px solid var(--line);margin-top:30px}
.toplink{color:var(--blue);cursor:pointer;font-weight:700;text-decoration:underline;background:none;border:none;font-family:inherit;font-size:inherit}
mark{background:#fde68a;padding:0 2px;border-radius:3px}
@media(max-width:600px){
  .dcontent,.card{padding-inline:14px}
  h2{font-size:1.3rem}
  .fcfront .q{font-size:1.1rem}
}
</style>
</head>
<body>
<div id="appMain">
  <aside class="sidebar">
    <div class="side-brand">
      <div class="brand-logo">⚖️</div>
      <div>
        <div class="brand-title">סדר דין פלילי</div>
        <div class="brand-sub">הסיכומים והאפליקציה של אסף אלוני</div>
      </div>
    </div>
    <nav class="side-nav" id="nav"></nav>
    <div class="side-foot" id="sideFoot">
      © אסף אלוני · כל הזכויות שמורות<br>מבוסס על הרצאות פרופ' טמיר ועו"ד זגורי — לשימוש אישי בלבד
    </div>
  </aside>
  <main class="main">
    <div class="main-head" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div class="main-title" id="mainTitle">בית</div>
      <div id="userBar" style="display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--muted)"></div>
    </div>
    <div class="wrap" id="app"></div>
    <footer class="wrap" style="margin-top:30px">
      <p>אפליקציית לימוד עצמית שנוצרה ע"י אסף אלוני · אינה תחליף לחומרי הקורס הרשמיים · © כל הזכויות שמורות</p>
      <p style="margin-top:6px"><button class="toplink" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑ חזרה למעלה</button></p>
    </footer>
  </main>
</div>
<script>
/* ============ DATA ============ */
window.DATA = {};
</script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
